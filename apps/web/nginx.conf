server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 与后端体量上限保持一致，避免大请求被 413
  client_max_body_size 30m;

  # 压缩：静态资源 + /api JSON 全走 gzip。
  # gzip_proxied any 才会压来自上游的响应（默认 off 时 /api 的 JSON 不压）；
  # text/event-stream 不在类型表里，/v1 SSE 流式不受影响。
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # 安全响应头（CSP 允许 antd 的内联样式）
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # 控制台 API → 后端
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OpenAI 兼容网关（关闭缓冲以支持 SSE 流式）
  location /v1/ {
    proxy_pass http://api:3000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    chunked_transfer_encoding on;
  }

  # 构建产物文件名带内容 hash → 一年长缓存，命中后不再回源协商。
  # ⚠️ location 内一旦出现 add_header 就不再继承 server 级的头，安全头必须在此重复。
  # 该 location 不配 try_files：资源缺失应 404，而不是回落成 index.html 的 200 HTML。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }

  # 入口 HTML 必须每次协商：否则发版后浏览器可能仍用缓存的旧 index.html，
  # 引用已被新构建覆盖删除的旧 hash chunk → try_files 落 404 → 白屏。
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }

  # 前端单页应用
  location / {
    try_files $uri $uri/ /index.html;
  }
}
