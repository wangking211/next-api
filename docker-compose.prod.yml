services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: !reset []

  redis:
    ports: !reset []

  api:
    environment:
      DATABASE_URL: postgresql://aigw:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ai_gateway?schema=public
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    ports: !override
      - "127.0.0.1:3000:3000"

  web:
    ports: !override
      - "127.0.0.1:8081:80"
