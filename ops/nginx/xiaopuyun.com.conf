# 生产站点反向代理：xiaopuyun.com / www.xiaopuyun.com
#
# 安装位置：/etc/nginx/conf.d/aigateway.conf
# 上游拓扑：容器仅监听回环地址（web 127.0.0.1:8081、api 127.0.0.1:3000），
#          本配置把站点全部流量转发到 web 容器；web 容器内的 nginx 再把
#          /api/ 与 /v1/ 转发给 api 容器（见 apps/web/nginx.conf）。
#
# 注意：证书相关行由 Certbot 管理（ssl_certificate / options-ssl / dhparam），
#      续期与改写均由 Certbot 负责，手工修改时请保留这些行。

server {
    server_name xiaopuyun.com www.xiaopuyun.com;

    client_max_body_size 30M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xiaopuyun.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xiaopuyun.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.xiaopuyun.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = xiaopuyun.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name xiaopuyun.com www.xiaopuyun.com;
    return 404; # managed by Certbot
}
