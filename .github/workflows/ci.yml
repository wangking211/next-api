name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test-build:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # corepack 在本步之后才启用，setup-node 此时找不到 pnpm → 必须关闭它的包管理器缓存；
          # pnpm store / corepack 下载由下面的 actions/cache 兜住
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path 2>/dev/null || echo "$HOME/.local/share/pnpm/store")" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @ai-gateway/api prisma:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  security-audit:
    name: Dependency audit (prod, npmjs registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable
      # pnpm audit 依赖锁文件，不需要安装依赖；必须走 npmjs registry（npmmirror 无 audit 端点）
      - name: Audit production dependencies
        run: |
          set +e
          pnpm audit --prod --registry=https://registry.npmjs.org --json > audit.json 2> audit.err
          set -e
          if [ -s audit.json ]; then
            node scripts/audit-gate.mjs audit.json
          else
            echo "pnpm audit produced no JSON output (see audit.err); failing closed is avoided, but check:"
            cat audit.err || true
            exit 1
          fi

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigw
          POSTGRES_PASSWORD: aigw_dev_pass
          POSTGRES_DB: ai_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigw -d ai_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aigw:aigw_dev_pass@localhost:5432/ai_gateway?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-production
      ENCRYPTION_KEY: a3f9c1e75b2d84609f1c3e5a7b9d02468ace13579bdf02468ace13579bdf0246
      BOOTSTRAP_ADMIN_EMAIL: admin@aigw.local
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin123456
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # corepack 在本步之后才启用，setup-node 此时找不到 pnpm → 必须关闭它的包管理器缓存；
          # pnpm store / corepack 下载由下面的 actions/cache 兜住
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path 2>/dev/null || echo "$HOME/.local/share/pnpm/store")" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @ai-gateway/api prisma:generate
      - name: Migrate database
        run: pnpm --filter @ai-gateway/api prisma:deploy
      - name: Build API
        run: pnpm --filter @ai-gateway/api build
      - name: Run e2e suite
        run: pnpm test:e2e
